<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>DevAI 小助手</title>
<style>
  :root{
    --paper:#f6f4ee;
    --paper2:#efece3;
    --card:#fffdf8;
    --ink:#22262a;
    --ink2:#5b6167;
    --line:#ddd6c7;
    --accent:#2c7a6f;
    --accent2:#e2643b;
    --danger:#b0343c;
    --warn:#a46a18;
    --ok:#3c7a4a;
    --blue:#2f5f8f;
    --code-bg:#23262a;
    --code-ink:#eae5da;
  }
  *{box-sizing:border-box;border-radius:0 !important}
  html,body{height:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
    font-size:16px;line-height:1.65;
    display:flex;flex-direction:column;height:100vh;overflow:hidden;
  }
  /* ---------- 顶栏 ---------- */
  header{
    flex:0 0 auto;background:linear-gradient(180deg,#fffdf8,#f2eee4);
    border-bottom:2px solid var(--ink);padding:8px 10px;
    display:flex;align-items:center;gap:9px;position:relative;z-index:5;
  }
  .facemini{flex:0 0 auto;width:36px;height:36px;border:2px solid var(--ink);background:#eaf3f0;box-shadow:2px 2px 0 var(--ink)}
  .facemini svg{width:100%;height:100%;display:block}
  .titlebox{min-width:0;line-height:1.15}
  .title{font-size:17px;font-weight:700;letter-spacing:.4px;white-space:nowrap}
  .subtitle{font-size:11px;color:var(--ink2);letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spacer{flex:1}
  .pill{font-size:12px;padding:2px 8px;border:1.5px solid var(--line);background:var(--paper2);color:var(--ink2);white-space:nowrap}
  .pill.live{border-color:var(--accent);color:var(--accent);background:#eaf3f0}
  .pill.busy{border-color:var(--warn);color:var(--warn);background:#fbf1e0}
  .icobtn{
    width:30px;height:30px;flex:0 0 auto;border:2px solid var(--ink);background:var(--card);
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
    box-shadow:2px 2px 0 var(--ink);transition:transform .08s,box-shadow .08s;
  }
  .icobtn:hover{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
  .icobtn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
  .icobtn svg{width:16px;height:16px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .icobtn.on{background:var(--accent);border-color:#1d564e;box-shadow:2px 2px 0 #1d564e}
  .icobtn.on svg{stroke:#fff}

  #statusbar{flex:0 0 auto;height:3px;background:var(--paper2);overflow:hidden;position:relative}
  #statusbar .bar{position:absolute;inset:0;width:0%;background:var(--accent);transition:width .25s ease}
  #statusbar.busy .bar{
    width:100% !important;opacity:.85;
    background:repeating-linear-gradient(115deg,var(--accent2) 0 12px,#d9855f 12px 24px);
    animation:slide 1s linear infinite;
  }
  @keyframes slide{from{background-position:0 0}to{background-position:48px 0}}

  /* ---------- 滚动区 ---------- */
  #feed{
    flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:12px 11px 8px;
    display:flex;flex-direction:column;gap:11px;scroll-behavior:smooth;
  }
  #feed::-webkit-scrollbar{width:9px}
  #feed::-webkit-scrollbar-thumb{background:#cfc7b6;border:2px solid var(--paper)}

  .card{
    background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--blue);
    padding:10px 11px 12px;box-shadow:3px 3px 0 rgba(34,38,42,.07);
    animation:pop .24s ease-out both;
  }
  @keyframes pop{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .card.err{border-left-color:var(--danger)}
  .card.ok{border-left-color:var(--ok)}
  .card.warn{border-left-color:var(--warn)}
  .card.crash{border-left-color:var(--accent2)}
  .card.log{border-left-color:#8a8272;background:#fbf9f3;padding:8px 10px}
  .card.chat{border-left-color:var(--blue);background:#f4f7f9}

  .ctop{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .ctitle{font-size:16px;font-weight:700;letter-spacing:.2px}
  .tag{font-size:11.5px;padding:1px 6px;border:1px solid currentColor;letter-spacing:.4px;white-space:nowrap}
  .tag.err{color:var(--danger)} .tag.ok{color:var(--ok)} .tag.warn{color:var(--warn)}
  .tag.crash{color:var(--accent2)} .tag.info{color:var(--blue)} .tag.gray{color:var(--ink2)}
  .meta{font-size:12px;color:var(--ink2);margin-top:2px}

  /* ---------- 小D 场景 ---------- */
  .bubble{
    position:relative;margin:9px 0 0;padding:8px 11px;background:#eaf3f0;
    border:2px solid var(--ink);box-shadow:3px 3px 0 rgba(34,38,42,.12);
    font-size:14.5px;font-weight:700;
  }
  .bubble:after{
    content:"";position:absolute;left:22px;bottom:-11px;width:0;height:0;
    border:6px solid transparent;border-top-color:var(--ink);
  }
  .bubble .bsub{font-weight:400;font-size:12.5px;color:var(--ink2);margin-top:2px}
  .bubble.crash{background:#fdeee8;border-color:#8c3620}
  .bubble.crash:after{border-top-color:#8c3620}
  .bubble.warnb{background:#fbf1de;border-color:#7a5416}
  .bubble.warnb:after{border-top-color:#7a5416}
  .bubble.okb{background:#e9f2e6;border-color:#2f5b3a}
  .bubble.okb:after{border-top-color:#2f5b3a}

  .stage{position:relative;margin-top:15px;padding:0 0 4px 0;min-height:120px}
  .codebox{
    margin-left:80px;border:2px solid var(--ink);background:var(--code-bg);
    color:var(--code-ink);box-shadow:4px 4px 0 rgba(34,38,42,.18);position:relative;
  }
  .codebox:before{
    content:"";position:absolute;left:12px;top:-9px;width:44px;height:14px;
    background:rgba(226,100,59,.55);border:1px solid rgba(34,38,42,.5);transform:rotate(-2.4deg);
  }
  .codehead{
    display:flex;align-items:center;gap:8px;padding:3px 8px;background:#1b1e21;
    border-bottom:1px solid #000;font-size:11.5px;color:#a9b1b6;
  }
  .codehead .fn{color:#eae5da;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .codehead .lnno{margin-left:auto;color:#e2643b;font-weight:700;white-space:nowrap}
  .clines{padding:5px 0 6px;overflow:hidden}
  .cline{
    display:flex;align-items:flex-start;gap:7px;padding:1px 8px 1px 0;
    font-family:"Cascadia Mono","Consolas","Courier New",monospace;
    font-size:12.6px;line-height:1.72;white-space:pre;position:relative;
    transition:background .2s;
  }
  .cline .ln{
    flex:0 0 30px;text-align:right;color:#6d7680;user-select:none;font-size:11.5px;padding-top:1px;
  }
  .cline .lc{flex:1;overflow:hidden;text-overflow:ellipsis}
  .cline.hot{
    background:linear-gradient(90deg,rgba(176,52,60,.42),rgba(176,52,60,.12));
    box-shadow:inset 3px 0 0 #ff6b6b;
    animation:hotpulse 1.8s ease-in-out infinite;
  }
  .cline.hot .ln{color:#ffb4b4;font-weight:700}
  .cline.hot .lc{color:#fff1f1}
  @keyframes hotpulse{0%,100%{box-shadow:inset 3px 0 0 #ff6b6b,0 0 0 rgba(255,107,107,0)}50%{box-shadow:inset 3px 0 0 #ff8f8f,0 0 16px rgba(255,107,107,.35)}}
  .cline.warnhot{background:linear-gradient(90deg,rgba(196,132,32,.35),rgba(196,132,32,.08));box-shadow:inset 3px 0 0 #e7b35a;animation:none}
  .cline.warnhot .ln{color:#ffd9a0}
  .cline .gutter{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:10.5px;color:#ffb4b4;opacity:.9}
  .cline .kw{color:#7fd1c4}
  .cline .str{color:#f0b07a}
  .cline .num{color:#9fb8e8}
  .cline .cmt{color:#7f8b93;font-style:italic}
  .cline .pp{color:#d99ad6}
  .cline .fnc{color:#e8d07a}

  .robotzone{position:absolute;left:-4px;bottom:-6px;width:78px;z-index:3;pointer-events:none}
  .robot svg{width:100%;height:auto;display:block;overflow:visible}
  .robot .breathe{animation:breathe 2.8s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(2.5px)}}
  .robot .eyes{transform-box:view-box;transform-origin:50px 40px;animation:blink 4s infinite}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
  .robot .antenna{animation:blinkdot 1.6s ease-in-out infinite}
  @keyframes blinkdot{0%,100%{fill:#e2643b}50%{fill:#ffb08c}}
  .robot .arm{transform-box:view-box;transform-origin:76px 70px;transition:transform .55s cubic-bezier(.34,1.6,.5,1.1)}
  .robot .xeyes,.robot .eyebrow,.robot .cheek{display:none}
  .robot .mouth{fill:none;stroke:#22262a;stroke-width:2}
  .robot .m-smile,.robot .m-flat,.robot .m-o,.robot .m-frown{display:none}
  .robot.m-idle .m-smile{display:block}
  .robot.m-worried .m-frown{display:block}
  .robot.m-worried .eyebrow{display:block}
  .robot.m-worried .eyebrow path{stroke:#22262a;stroke-width:2;fill:none}
  .robot.m-happy .m-smile{display:block}
  .robot.m-happy .cheek{display:block}
  .robot.m-happy .breathe{animation:hop .9s ease-in-out infinite}
  @keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
  .robot.m-dizzy .eyes{display:none}
  .robot.m-dizzy .xeyes{display:block}
  .robot.m-dizzy .m-o{display:block}
  .robot.m-dizzy .breathe{animation:shake .35s linear infinite}
  @keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
  .robot.m-think .m-flat{display:block}
  .robot.m-flag .m-smile{display:block}

  svg.leader{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:4}
  .leader .path{fill:none;stroke:#e2643b;stroke-width:2.5;stroke-dasharray:9 7;stroke-linejoin:round;animation:flow .7s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-32}}
  .leader .ring{fill:none;stroke:#e2643b;stroke-width:2;animation:ring 1.3s ease-out infinite}
  @keyframes ring{0%{r:4;opacity:.9}100%{r:16;opacity:0}}
  .leader circle.dot{fill:#e2643b}

  /* 代码扫描（加载中） */
  .scanline{
    position:absolute;left:80px;right:0;height:3px;top:0;background:linear-gradient(90deg,transparent,#2c7a6f,transparent);
    box-shadow:0 0 12px #2c7a6f;animation:scan 2.2s ease-in-out infinite;z-index:5;
  }
  @keyframes scan{0%{top:6%;opacity:.2}50%{top:92%;opacity:1}100%{top:6%;opacity:.2}}
  .magnify{position:absolute;left:6px;bottom:14px;width:66px;z-index:3;animation:mag 2.2s ease-in-out infinite}
  @keyframes mag{0%,100%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(6px,-10px) rotate(6deg)}}
  .magnify svg{width:100%;display:block}

  /* ---------- 撞墙动画 ---------- */
  .crashscene{
    position:relative;height:168px;margin-top:14px;overflow:hidden;
    border:2px solid var(--ink);background:
      repeating-linear-gradient(0deg,#f7f4ec 0 27px,#efeade 27px 28px);
    box-shadow:3px 3px 0 rgba(34,38,42,.1);
  }
  .crashscene .floor{position:absolute;left:0;right:0;bottom:0;height:16px;background:#d9d2c2;border-top:2px solid var(--ink)}
  .crashscene .wall{
    position:absolute;right:0;bottom:16px;width:34px;height:126px;
    background:
      repeating-linear-gradient(0deg,#b0343c 0 18px,#9a2c33 18px 19px),
      repeating-linear-gradient(90deg,transparent 0 28px,#8d262d 28px 30px);
    border:2px solid var(--ink);border-right:none;
  }
  .crashscene .wall span{
    position:absolute;left:-62px;top:42px;transform:rotate(-90deg);transform-origin:center;
    font-size:11px;font-weight:700;color:#fff;background:#8d262d;padding:1px 6px;white-space:nowrap;letter-spacing:1px;
  }
  .crashscene .crashrobot{position:absolute;left:0;bottom:12px;width:70px;z-index:2;will-change:transform}
  .crashscene .crashrobot svg{width:100%;display:block}
  .crashscene .speed{position:absolute;height:2px;background:#8a8272;opacity:0;z-index:1}
  .crashscene .flash{position:absolute;inset:0;background:#ffd9c7;opacity:0;z-index:3;pointer-events:none}
  .crashscene .stars{position:absolute;z-index:4;font-size:20px;color:#e2643b;opacity:0;letter-spacing:4px;text-shadow:1px 1px 0 #22262a}
  .crashscene .cap{
    position:absolute;left:10px;top:8px;z-index:5;font-size:13px;font-weight:700;color:#8c3620;
    background:#fff3ec;border:1.5px solid #8c3620;padding:1px 8px;opacity:0;
  }
  .crashscene .replay{
    position:absolute;right:6px;bottom:4px;z-index:6;font-family:inherit;font-size:11px;
    padding:1px 7px;background:#fffdf8;border:1.5px solid var(--ink);cursor:pointer;
  }
  .crashscene.play .crashrobot{animation:crashrun 2.6s cubic-bezier(.3,.1,.3,1) forwards}
  .crashscene.play .crashrobot .breathe{animation:runbob .16s steps(2) infinite}
  .crashscene.play .wall{animation:wallhit .5s 1.28s ease-out both}
  .crashscene.play .flash{animation:flash .45s 1.3s ease-out both}
  .crashscene.play .stars{animation:stars .9s 1.36s ease-out both}
  .crashscene.play .cap{animation:capin .4s 1.5s ease-out both}
  .crashscene.play .s1{animation:speed .5s 0.35s linear infinite}
  .crashscene.play .s2{animation:speed .5s 0.6s linear infinite}
  .crashscene.play .s3{animation:speed .5s 0.85s linear infinite}
  @keyframes crashrun{
    0%{transform:translateX(0) rotate(0)}
    36%{transform:translateX(calc(var(--run) * .62)) rotate(0)}
    49%{transform:translateX(var(--run)) rotate(0)}
    53%{transform:translateX(calc(var(--run) - 16px)) rotate(-16deg)}
    66%{transform:translateX(calc(var(--run) - 26px)) rotate(8deg)}
    100%{transform:translateX(calc(var(--run) - 24px)) rotate(-7deg)}
  }
  @keyframes runbob{0%{transform:translateY(0)}50%{transform:translateY(-4px)}100%{transform:translateY(0)}}
  @keyframes wallhit{0%{transform:translateX(0)}30%{transform:translateX(7px)}60%{transform:translateX(-3px)}100%{transform:translateX(0)}}
  @keyframes flash{0%{opacity:0}25%{opacity:.8}100%{opacity:0}}
  @keyframes stars{0%{opacity:0;transform:scale(.5) rotate(0)}30%{opacity:1;transform:scale(1.1) rotate(12deg)}100%{opacity:.9;transform:scale(1) rotate(-8deg)}}
  @keyframes capin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes speed{0%{opacity:0;transform:translateX(0)}30%{opacity:.7}100%{opacity:0;transform:translateX(-34px)}}

  /* ---------- 合唱/成功 ---------- */
  .celebrate{position:relative;height:132px;margin-top:14px;border:2px solid var(--ink);
    background:repeating-linear-gradient(0deg,#f4f8f2 0 27px,#eaf1e7 27px 28px);overflow:hidden}
  .celebrate .robotbig{position:absolute;left:14px;bottom:-6px;width:78px}
  .celebrate .bubble2{
    position:absolute;left:104px;top:16px;font-size:14px;font-weight:700;color:#2f5b3a;
    background:#eef7ea;border:2px solid #2f5b3a;padding:5px 10px;box-shadow:3px 3px 0 rgba(47,91,58,.18);
  }
  .celebrate .bubble2:before{content:"";position:absolute;left:-12px;top:14px;border:6px solid transparent;border-right-color:#2f5b3a}
  .confetti{position:absolute;top:-10px;width:7px;height:12px;opacity:.9;animation:fall linear infinite}
  @keyframes fall{0%{transform:translateY(-14px) rotate(0)}100%{transform:translateY(150px) rotate(320deg)}}

  /* ---------- 正文分区 ---------- */
  .sec{margin-top:12px}
  .sec-h{
    display:flex;align-items:center;gap:6px;
    font-size:11.5px;letter-spacing:1.2px;color:var(--ink2);
    border-bottom:1px dashed var(--line);padding-bottom:3px;margin-bottom:6px;
  }
  .sec-h b{color:var(--ink);letter-spacing:.3px;font-size:12.5px}
  .sec p{margin:0;font-size:14.5px}
  .steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
  .step{
    display:flex;gap:9px;align-items:flex-start;font-size:14.5px;
    animation:stepin .35s ease-out both;
  }
  @keyframes stepin{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
  .step .sno{
    flex:0 0 22px;height:22px;background:var(--accent);color:#fff;font-weight:700;
    display:flex;align-items:center;justify-content:center;font-size:13px;
    border:1.5px solid #1d564e;box-shadow:2px 2px 0 rgba(29,86,78,.6);margin-top:2px;
  }
  .step .stxt{flex:1;min-width:0}

  .codesnip{
    margin:0;padding:8px 10px;background:var(--code-bg);color:var(--code-ink);
    font-family:"Cascadia Mono","Consolas",monospace;font-size:13px;line-height:1.6;
    overflow-x:auto;white-space:pre;border:1px solid #111;
  }
  .codesnip .kw{color:#7fd1c4}.codesnip .str{color:#f0b07a}.codesnip .num{color:#9fb8e8}
  .codesnip .cmt{color:#7f8b93;font-style:italic}.codesnip .pp{color:#d99ad6}.codesnip .fnc{color:#e8d07a}

  /* 改前 / 改后 */
  .diff{margin-top:4px;border:2px solid var(--ink);background:#fbf9f3}
  .diffrow{display:flex;align-items:stretch;font-family:"Cascadia Mono","Consolas",monospace;font-size:13px}
  .diffrow .flag{
    flex:0 0 42px;display:flex;align-items:center;justify-content:center;
    font-family:"Microsoft YaHei",sans-serif;font-size:11.5px;font-weight:700;color:#fff;letter-spacing:.5px;
  }
  .diffrow.before .flag{background:#a13138}
  .diffrow.after .flag{background:#3c7a4a}
  .diffrow .dtx{flex:1;min-width:0;padding:7px 8px;white-space:pre-wrap;word-break:break-all;background:#2a2d31;color:#eee7dc}
  .diffrow.before .bad{background:#7d262c;color:#ffdada;text-decoration:line-through;padding:0 1px;box-shadow:0 0 0 1px #b0343c}
  .diffrow.after .good{background:#2f5b3a;color:#e8ffe9;padding:0 1px;box-shadow:0 0 0 1px #3c7a4a;animation:goodpop .5s .25s both}
  @keyframes goodpop{0%{background:#2f5b3a;box-shadow:0 0 0 1px #3c7a4a,0 0 0 rgba(60,122,74,0)}45%{box-shadow:0 0 0 1px #3c7a4a,0 0 16px rgba(60,122,74,.75)}100%{box-shadow:0 0 0 1px #3c7a4a,0 0 6px rgba(60,122,74,.25)}}
  .diffmid{
    display:flex;align-items:center;gap:7px;justify-content:center;
    padding:3px;background:#f2eee4;border-top:1px dashed #cfc7b6;border-bottom:1px dashed #cfc7b6;
    font-size:12px;color:var(--ink2);letter-spacing:.5px;
  }
  .diffmid .ar{color:var(--ok);font-weight:700;font-size:15px;animation:arrowbob 1.1s ease-in-out infinite}
  @keyframes arrowbob{0%,100%{transform:translateY(-2px)}50%{transform:translateY(2px)}}
  .diff body{}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .chip{font-size:12.5px;padding:1px 8px;background:#eef1ee;border:1px solid #cdd6cf;color:#3b4a41}

  .row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  button.act{
    font-family:inherit;font-size:13px;padding:5px 10px;cursor:pointer;
    background:var(--card);color:var(--ink);border:1.5px solid var(--ink);
    box-shadow:2px 2px 0 var(--ink);transition:transform .08s,box-shadow .08s;
  }
  button.act:hover{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
  button.act:active{transform:translate(2px,2px);box-shadow:none}
  button.act.primary{background:var(--accent);color:#fff;border-color:#1d564e;box-shadow:2px 2px 0 #1d564e}
  button.act.warn{background:var(--accent2);color:#fff;border-color:#9c3f1c;box-shadow:2px 2px 0 #9c3f1c}
  button.act:disabled{opacity:.55;cursor:not-allowed;transform:none!important}

  pre.log{
    max-height:150px;overflow:auto;font-size:12px;background:#f2efe7;color:#3a3d3f;
    border:1px dashed var(--line);white-space:pre-wrap;word-break:break-all;margin:6px 0 0;
    padding:7px 9px;font-family:"Cascadia Mono","Consolas",monospace;
  }
  .logbar{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
  .logbar .dotp{width:9px;height:9px;background:var(--accent2);animation:blinkdot2 1s infinite}
  @keyframes blinkdot2{0%,100%{opacity:1}50%{opacity:.3}}
  .logbar .chev{margin-left:auto;font-size:12px;color:var(--ink2)}
  .errow{
    font-family:"Cascadia Mono","Consolas",monospace;font-size:12.5px;
    background:#fbeeee;border-left:3px solid var(--danger);padding:4px 8px;margin:4px 0;
    word-break:break-all;color:#6c2b2f;
  }
  .okrow{
    font-family:"Cascadia Mono","Consolas",monospace;font-size:12.5px;
    background:#eef6ef;border-left:3px solid var(--ok);padding:4px 8px;margin:4px 0;
    color:#2f5b3a;word-break:break-all;
  }
  .warnrow{
    font-family:"Cascadia Mono","Consolas",monospace;font-size:12.5px;
    background:#fdf6e8;border-left:3px solid var(--warn);padding:4px 8px;margin:4px 0;
    color:#795015;word-break:break-all;
  }
  .loading{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink2)}
  .dots span{display:inline-block;width:6px;height:6px;background:var(--accent);margin-right:4px;animation:blink 1.1s infinite}
  .dots span:nth-child(2){animation-delay:.18s}
  .dots span:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
  .hint{font-size:13.5px;color:var(--ink2)}

  /* ---------- 底部追问 ---------- */
  footer{
    flex:0 0 auto;border-top:2px solid var(--ink);background:var(--paper2);
    padding:7px 8px;display:flex;gap:7px;align-items:flex-end;
  }
  textarea#q{
    flex:1;resize:none;height:40px;padding:8px 9px;font-family:inherit;font-size:14.5px;
    border:1.5px solid var(--line);background:var(--card);color:var(--ink);outline:none;
  }
  textarea#q:focus{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  #sendbtn{
    flex:0 0 auto;height:40px;padding:0 14px;font-size:14.5px;font-weight:700;font-family:inherit;
    background:var(--accent);color:#fff;border:2px solid #1d564e;box-shadow:2px 2px 0 #1d564e;cursor:pointer;
  }
  #sendbtn:active{transform:translate(2px,2px);box-shadow:none}

  /* ---------- 设置 ---------- */
  #settings{position:fixed;inset:0;background:rgba(30,32,34,.45);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
  #settings.show{display:flex}
  .sheet{width:100%;max-width:430px;max-height:88vh;overflow:auto;background:var(--card);border:2px solid var(--ink);box-shadow:5px 5px 0 rgba(34,38,42,.35)}
  .sheet-h{display:flex;align-items:center;padding:10px 13px;border-bottom:2px solid var(--ink);background:var(--paper2);font-size:16px;font-weight:700}
  .sheet-b{padding:13px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px;letter-spacing:.3px}
  .field input[type=text],.field input[type=password],.field select{
    width:100%;padding:7px 9px;border:1.5px solid var(--line);background:#fff;
    font-family:inherit;font-size:14.5px;color:var(--ink);outline:none;
  }
  .field input:focus,.field select:focus{border-color:var(--accent)}
  .switch{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0}
  .switch input{width:17px;height:17px;accent-color:var(--accent)}
  .tip{font-size:12.5px;color:var(--ink2);line-height:1.6;background:#f3f1e9;border-left:3px solid var(--warn);padding:7px 9px}
  #testresult{font-size:13.5px;margin-top:7px;word-break:break-all}

  .banner{
    margin:0 11px;margin-top:10px;padding:9px 11px;background:#fdf3e6;
    border:1.5px solid var(--warn);border-left:6px solid var(--warn);font-size:13.5px;color:#6d4a12;
    display:flex;gap:9px;align-items:center;flex-wrap:wrap;
  }
  .banner b{color:#5a3c0d}

  .empty{margin:auto;text-align:center;color:var(--ink2);font-size:14px;line-height:1.9;padding:6px 6px 20px}
  .empty .big{font-size:16px;color:var(--ink);font-weight:700;margin-bottom:4px}
  .empty .emrobot{width:104px;margin:0 auto 6px}
  .empty .emrobot svg{width:100%;display:block}
  kbd{font-family:inherit;border:1px solid #c9c2b2;background:#fbf9f3;padding:0 5px;font-size:12.5px}

  /* ---------- 状态一行 ---------- */
  #statline{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:5px 11px;
    font-size:12.5px;color:var(--ink2);background:var(--paper2);border-bottom:1px solid var(--line);
  }
  #stNow{font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #stLast{margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:58%;text-align:right}

  /* ---------- 三个固定框 ---------- */
  .boxes{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .box{border:1.5px solid var(--ink);background:var(--card);box-shadow:3px 3px 0 rgba(34,38,42,.08)}
  .box.b1{border-left:6px solid var(--danger)}
  .box.b2{border-left:6px solid var(--accent)}
  .box.b3{border-left:6px solid var(--blue)}
  .box-h{display:flex;align-items:center;gap:7px;padding:4px 9px;border-bottom:1.5px solid var(--ink);background:var(--paper2)}
  .box-h .no{width:19px;height:19px;background:var(--ink);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .box-h b{font-size:13px;letter-spacing:.3px}
  .box-h .sub{margin-left:auto;font-size:11px;color:var(--ink2)}
  .box-b{padding:9px 10px}
  .box-b p{margin:0;font-size:14.5px}
  .box-b p+p{margin-top:6px;color:var(--ink2);font-size:13.5px}

  .toast{
    position:fixed;left:50%;bottom:70px;transform:translateX(-50%);
    background:#22262a;color:#fff;font-size:13px;padding:6px 12px;z-index:30;
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  }
  .toast.show{opacity:1;transform:translate(-50%,-6px)}
</style>
</head>
<body>
<header>
  <div class="facemini" id="facemini"></div>
  <div class="titlebox">
    <div class="title">DevAI 小助手</div>
    <div class="subtitle">小D 会指着出错的那一行，讲给你听</div>
  </div>
  <div class="spacer"></div>
  <span class="pill live" id="statuspill">待命</span>
  <button class="icobtn" id="btnDock" title="在 Dev-C++ 里嵌入 / 独立浮窗"></button>
  <button class="icobtn" id="btnReview" title="给整段代码做体检">
    <svg viewBox="0 0 24 24"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>
  </button>
  <button class="icobtn" id="btnSet" title="设置 API Key">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
  </button>
</header>
<div id="statusbar"><div class="bar"></div></div>
<div id="statline"><span id="stNow">待命</span><span id="stLast">上次：—</span></div>

<div id="feed"></div>

<footer>
  <textarea id="q" placeholder="还有哪不懂？直接问小D…"></textarea>
  <button id="sendbtn">问</button>
</footer>

<div id="settings">
  <div class="sheet">
    <div class="sheet-h">设置 <span class="spacer" style="flex:1"></span>
      <button class="icobtn" id="btnCloseSet" style="width:26px;height:26px">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6l-12 12"/></svg>
      </button>
    </div>
    <div class="sheet-b">
      <div class="field"><label>接口地址</label><input type="text" id="cfgBase" placeholder="https://api.deepseek.com" /></div>
      <div class="field"><label>API Key</label><input type="password" id="cfgKey" placeholder="sk-..." /></div>
      <div class="field"><label>模型</label><input type="text" id="cfgModel" placeholder="deepseek-chat" /></div>
      <div class="field"><label>温度（越小越严谨，0~1）</label><input type="text" id="cfgTemp" placeholder="0.2" /></div>
      <div class="switch"><input type="checkbox" id="cfgAutoOpen" /><label for="cfgAutoOpen">启动时自动打开面板</label></div>
      <div class="switch"><input type="checkbox" id="cfgWarn" /><label for="cfgWarn">有警告时也讲解</label></div>
      <div class="switch"><input type="checkbox" id="cfgRun" /><label for="cfgRun">程序崩溃时自动讲解</label></div>
      <div class="tip">
        DeepSeek：地址 <b>https://api.deepseek.com</b>，模型 <b>deepseek-chat</b>，Key 在 platform.deepseek.com 申请。<br>
        其它中转站 / 本地 Ollama（OpenAI 兼容）填对应地址即可。
      </div>
      <div class="row">
        <button class="act primary" id="btnSave">保存</button>
        <button class="act" id="btnTest">测试连接</button>
      </div>
      <div id="testresult"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const feedEl = document.getElementById('feed');
  const pill = document.getElementById('statuspill');
  const barWrap = document.getElementById('statusbar');
  let cfg = {}, dockMode = 'dock', lastFocusFile = '';
  const cards = new Map();

  /* ------------------------------------------------------------------ 工具 */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
  function ms(n){ return n>=1000 ? (n/1000).toFixed(2)+' 秒' : n+' 毫秒'; }
  function timeStr(ts){ const d=new Date(ts||Date.now()); return [d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':'); }
  function toast(t){
    const n=document.getElementById('toast'); n.textContent=t; n.classList.add('show');
    clearTimeout(n._t); n._t=setTimeout(()=>n.classList.remove('show'),1800);
  }

  /* 代码着色 */
  const KEYWORDS = 'int|float|double|char|void|bool|long|short|unsigned|signed|const|static|struct|class|public|private|if|else|for|while|do|switch|case|break|continue|return|using|namespace|std|include|define|cout|cin|endl|printf|scanf|malloc|free|new|delete|true|false|NULL|nullptr|main|sizeof';
  function hl(code){
    const src = esc(code);
    const re = new RegExp('(\\/\\/[^\\n]*|"(?:[^"\\\\]|\\\\.)*"|\'(?:[^\'\\\\]|\\\\.)*\'|#\\w+|\\b(?:'+KEYWORDS+')\\b|\\b\\d+(?:\\.\\d+)?\\b)','g');
    return src.replace(re, (m)=>{
      if (/^\/\//.test(m)) return '<span class="cmt">'+m+'</span>';
      if (/^"/.test(m) || /^'/.test(m)) return '<span class="str">'+m+'</span>';
      if (/^#/.test(m)) return '<span class="pp">'+m+'</span>';
      if (/^\d/.test(m)) return '<span class="num">'+m+'</span>';
      return '<span class="kw">'+m+'</span>';
    });
  }

  /* ------------------------------------------------------------------ 小D */
  function robotSVG(mood){
    return `<div class="robot m-${mood}"><svg viewBox="0 0 100 124">
      <g class="breathe">
        <line x1="50" y1="17" x2="50" y2="7" stroke="#22262a" stroke-width="2.4"/>
        <circle class="antenna" cx="50" cy="5" r="4.4" fill="#e2643b" stroke="#22262a" stroke-width="2"/>
        <rect x="29" y="101" width="15" height="17" fill="#2c7a6f" stroke="#22262a" stroke-width="2"/>
        <rect x="56" y="101" width="15" height="17" fill="#2c7a6f" stroke="#22262a" stroke-width="2"/>
        <rect x="23" y="61" width="54" height="45" fill="#2c7a6f" stroke="#22262a" stroke-width="2.4"/>
        <rect x="37" y="72" width="26" height="19" fill="#eaf3f0" stroke="#22262a" stroke-width="1.6"/>
        <path d="M42 79h15M42 85h9" stroke="#2c7a6f" stroke-width="1.6"/>
        <path d="M23 63h54l-7 10h-40z" fill="#e2643b" stroke="#22262a" stroke-width="2.2"/>
        <rect x="20" y="16" width="60" height="46" fill="#fffdf8" stroke="#22262a" stroke-width="2.6"/>
        <rect x="13" y="31" width="7" height="15" fill="#2c7a6f" stroke="#22262a" stroke-width="2"/>
        <rect x="80" y="31" width="7" height="15" fill="#2c7a6f" stroke="#22262a" stroke-width="2"/>
        <g class="eyebrow"><path d="M31 29l11 4M69 29l-11 4"/></g>
        <g class="eyes">
          <rect x="32" y="34" width="11" height="12" fill="#22262a"/>
          <rect x="57" y="34" width="11" height="12" fill="#22262a"/>
        </g>
        <g class="xeyes"><path d="M33 34l9 10M42 34l-9 10M58 34l9 10M67 34l-9 10" stroke="#b0343c" stroke-width="2.6" fill="none"/></g>
        <path class="mouth m-smile" d="M42 51q8 6 16 0"/>
        <path class="mouth m-flat" d="M43 52h14"/>
        <path class="mouth m-o" d="M46 51a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"/>
        <path class="mouth m-frown" d="M42 55q8 -6 16 0"/>
        <circle class="cheek" cx="29" cy="47" r="3" fill="#eda58f"/>
        <circle class="cheek" cx="71" cy="47" r="3" fill="#eda58f"/>
        <path d="M23 69l-11 18" stroke="#22262a" stroke-width="10" stroke-linejoin="round"/>
        <path d="M23 69l-11 18" stroke="#2c7a6f" stroke-width="6"/>
        <circle cx="12" cy="88" r="5.5" fill="#fffdf8" stroke="#22262a" stroke-width="2"/>
        <g class="arm">
          <path d="M76 69l17-15" stroke="#22262a" stroke-width="10" stroke-linejoin="round"/>
          <path d="M76 69l17-15" stroke="#2c7a6f" stroke-width="6"/>
          <circle cx="94" cy="53" r="5.5" fill="#fffdf8" stroke="#22262a" stroke-width="2"/>
        </g>
        <g class="flagart" style="display:none"><line x1="12" y1="88" x2="12" y2="56" stroke="#22262a" stroke-width="2"/><path d="M12 57h18l-5 5 5 5h-18z" fill="#e7b35a" stroke="#22262a" stroke-width="1.6"/></g>
      </g>
    </svg></div>`;
  }
  document.getElementById('facemini').innerHTML =
    `<svg viewBox="0 0 100 124" style="transform:scale(1.18)">
      <g transform="translate(0,-8)">
        <line x1="50" y1="23" x2="50" y2="14" stroke="#22262a" stroke-width="2.4"/>
        <circle class="antenna" cx="50" cy="12" r="4" fill="#e2643b" stroke="#22262a" stroke-width="2" style="animation:blinkdot 1.6s infinite"/>
        <rect x="20" y="22" width="60" height="50" fill="#fffdf8" stroke="#22262a" stroke-width="2.6"/>
        <g class="eyes" style="transform-box:view-box;transform-origin:50px 45px;animation:blink 4s infinite">
          <rect x="32" y="40" width="11" height="12" fill="#22262a"/>
          <rect x="57" y="40" width="11" height="12" fill="#22262a"/>
        </g>
        <path d="M42 57q8 6 16 0" fill="none" stroke="#22262a" stroke-width="2"/>
      </g>
    </svg>`;

  /* ------------------------------------------------------------------ 场景 */
  function codeWindowHTML(focus, extra){
    if(!focus) return '';
    const hot = focus.line;
    let h = `<div class="codebox">
      <div class="codehead"><span class="fn">${esc(focus.name||'代码')}</span>
        <span>第 ${hot} 行</span><span class="lnno">● 小D指这里</span></div>
      <div class="clines">`;
    for(const l of focus.lines){
      const isHot = l.n === hot;
      h += `<div class="cline ${isHot?(extra&&extra.warn?'warnhot':'hot'):''}" data-n="${l.n}">
        <span class="ln">${l.n}</span><span class="lc">${hl(l.t)||' '}</span>
        ${isHot?`<span class="gutter">◀</span>`:''}
      </div>`;
    }
    h += `</div></div>`;
    return h;
  }

  function stageHTML(item, d){
    const focus = item.focus;
    const mood = item.scenario === 'warning' ? 'flag' : 'worried';
    const warn = item.scenario === 'warning';
    return `<div class="stage" data-stage>
      ${codeWindowHTML(focus, {warn})}
      <div class="robotzone">${robotSVG(mood)}</div>
      <svg class="leader" data-leader></svg>
    </div>`;
  }

  function loadingStageHTML(item){
    const focus = item.focus;
    return `<div class="stage" data-stage data-loading="1">
      ${focus ? codeWindowHTML(focus, {}) : ''}
      <div class="magnify"><svg viewBox="0 0 90 90">
        <circle cx="34" cy="34" r="21" fill="rgba(234,243,240,.85)" stroke="#22262a" stroke-width="3"/>
        <path d="M49 49l19 19" stroke="#22262a" stroke-width="6"/>
        <path d="M22 34h24M34 22v24" stroke="#2c7a6f" stroke-width="2.5" opacity=".8"/>
      </svg></div>
      ${focus ? '<div class="scanline"></div>' : ''}
    </div>`;
  }

  function crashSceneHTML(item){
    const info = item.exitInfo || {};
    return `<div class="crashscene" data-crash>
      <div class="floor"></div>
      <div class="wall"><span>${esc((info.name||'崩溃').slice(0,10))}</span></div>
      <div class="speed s1" style="left:18px;top:96px;width:22px"></div>
      <div class="speed s2" style="left:6px;top:114px;width:30px"></div>
      <div class="speed s3" style="left:24px;top:132px;width:18px"></div>
      <div class="crashrobot">${robotSVG('worried')}</div>
      <div class="flash"></div>
      <div class="stars">✦ ✧ ✦</div>
      <div class="cap">撞墙了！程序崩溃</div>
      <button class="replay" data-replay>重播</button>
    </div>`;
  }

  function celebrateHTML(){
    let c = '';
    const colors = ['#e2643b','#2c7a6f','#e7b35a','#2f5f8f','#b0343c'];
    for(let i=0;i<22;i++){
      c += `<i class="confetti" style="left:${(i*4.4)%100}%;background:${colors[i%colors.length]};animation-duration:${1.6+ (i%5)*0.22}s;animation-delay:${(i%7)*0.13}s"></i>`;
    }
    return `<div class="celebrate">
      ${c}
      <div class="robotbig">${robotSVG('happy')}</div>
      <div class="bubble2">编译通过！小D给你鼓掌 👏</div>
    </div>`;
  }

  /* ------------------------------------------------------------------ 改前改后 */
  function charDiff(a, b){
    let p = 0;
    while(p < a.length && p < b.length && a[p] === b[p]) p++;
    let s = 0;
    while(s < a.length-p && s < b.length-p && a[a.length-1-s] === b[b.length-1-s]) s++;
    return {
      pre: a.slice(0, p),
      bad: a.slice(p, a.length - s),
      suf: a.slice(a.length - s),
      good: (b.slice(0, p)) + (b.slice(p, b.length - s)) + (b.slice(b.length - s))
    };
  }

  function diffHTML(d){
    const bad = (d.badLine||'').trim();
    const good = (d.goodLine||'').trim();
    if(!bad && !good) return '';
    if(bad && good){
      const df = charDiff(bad, good);
      return `<div class="diff">
        <div class="diffrow before"><span class="flag">改前</span>
          <span class="dtx">${hl(df.pre)}<span class="bad">${esc(df.bad)||' '}</span>${hl(df.suf)}</span></div>
        <div class="diffmid"><span class="ar">▼</span> 小D帮你改成这样
          <span class="spacer" style="flex:1"></span>
          <button class="act" data-copy="${esc(good)}">复制这一行</button></div>
        <div class="diffrow after"><span class="flag">改后</span>
          <span class="dtx">${hl(df.good)}</span></div>
      </div>`;
    }
    return `<div class="diff">
      <div class="diffrow before"><span class="flag">改前</span><span class="dtx">${hl(bad||'（原来的写法）')}</span></div>
    </div>`;
  }

  /* ------------------------------------------------------------------ 卡片 */
  function cardBase(item, cls, tagText, tagCls){
    return el(`<div class="card ${cls}" data-id="${item.id}">
      <div class="ctop"><span class="ctitle">${esc(item.title||'')}</span>
        ${tagText?`<span class="tag ${tagCls||'info'}">${esc(tagText)}</span>`:''}
        <span class="spacer" style="flex:1"></span>
        <span class="meta">${timeStr(item.ts)}</span>
      </div>
      <div class="body"></div>
    </div>`);
  }

  function renderAnalysis(item){
    const isCrash = item.scenario === 'runtime';
    const baseCls = isCrash ? 'crash' : '';
    const c = cardBase(item, baseCls, isCrash?'崩溃复盘':(item.scenario==='review'?'代码体检':(item.scenario==='warning'?'警告':'诊断')), isCrash?'crash':'info');
    const body = c.querySelector('.body');

    if(item.status === 'loading'){
      body.innerHTML = `
        <div class="bubble">小D正在读你的代码…<div class="bsub">马上告诉你哪里不对、要怎么改</div></div>
        ${loadingStageHTML(item)}
        <div class="loading" style="margin-top:10px"><span class="dots"><span></span><span></span><span></span></span><span>正在逐行检查…</span></div>`;
      return c;
    }

    if(item.status === 'error'){
      c.className = 'card err';
      body.innerHTML = `<div class="bubble crash">啊哦，小D连不上 AI 服务器…</div>
        <div class="errow">${esc(item.error||'未知错误')}</div>
        <div class="row"><button class="act primary" data-goset>去填 API Key</button>
        <button class="act" data-retry>重新分析</button></div>`;
      return c;
    }

    const d = item.data || {};
    const focus = item.focus;
    const lineNo = d.line || (focus && focus.line) || 0;
    const bubbleCls = isCrash ? 'crash' : (item.scenario==='warning' ? 'warnb' : '');
    const bubbleMain = lineNo ? `第 ${lineNo} 行，问题就在这里！`
      : (isCrash ? '程序一头撞在墙上，小D来复盘' : '小D把你的代码从头看了一遍');
    const bubbleSub = lineNo ? '在 Dev-C++ 里看这一行，就是它' : (d.explain ? String(d.explain).slice(0,40) : '');

    let h = `<div class="bubble ${bubbleCls}">${esc(bubbleMain)}<div class="bsub">${esc(bubbleSub)}</div></div>`;

    if(isCrash){
      h += crashSceneHTML(item);
      if(item.exitInfo && item.exitInfo.hint){
        h += `<div class="warnrow" style="margin-top:8px">退出码 ${item.exitCode}（${esc(item.exitInfo.hex)}）· ${esc(item.exitInfo.name)}<br>${esc(item.exitInfo.hint)}</div>`;
      }
    }
    if(focus) h += stageHTML(item, d);

    /* ① 错误原因 */
    const why = d.why ? `<p>${esc(d.why).replace(/\n/g,'<br>')}</p>` : '';
    h += `<div class="boxes">
      <div class="box b1"><div class="box-h"><span class="no">1</span><b>错误原因</b></div>
        <div class="box-b"><p>${esc(d.explain || '（这次没拿到具体原因，先看下面的改法）').replace(/\n/g,'<br>')}</p>${why}</div></div>`;

    /* ② 具体位置 + 怎么改 + 改后代码 */
    h += `<div class="box b2"><div class="box-h"><span class="no">2</span><b>具体改这里</b>${lineNo?`<span class="sub">第 ${lineNo} 行</span>`:''}</div>
      <div class="box-b">`;
    if(d.where) h += `<p><b>位置：</b>${esc(d.where)}</p>`;
    if(d.fixSteps && d.fixSteps.length){
      h += `<ol class="steps" style="margin-top:8px">`;
      d.fixSteps.forEach((s,i)=>{ h += `<li class="step" style="animation-delay:${i*0.08}s"><span class="sno">${i+1}</span><span class="stxt">${esc(s)}</span></li>`; });
      h += `</ol>`;
    }
    const df = diffHTML(d);
    if(df) h += `<div style="margin-top:9px">${df}</div>`;
    if(d.fixedCode){
      h += `<div style="margin-top:9px">
        <pre class="codesnip">${hl(d.fixedCode)}</pre>
        <div class="row"><button class="act" data-copy="${esc(d.fixedCode)}">复制这段代码</button></div></div>`;
    }
    if(!d.where && !d.fixSteps?.length && !df && !d.fixedCode) h += `<p>照着报错行检查拼写和标点，改完再编译一次。</p>`;
    h += `</div></div>`;

    /* ③ 知识点与技巧 */
    h += `<div class="box b3"><div class="box-h"><span class="no">3</span><b>知识点 · 技巧</b></div>
      <div class="box-b">
        ${d.concepts && d.concepts.length ? `<div class="chips">${d.concepts.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>` : ''}
        <p style="margin-top:${d.concepts && d.concepts.length?8:0}px;color:#3b4a41">${esc(d.tip || '编译报错先看第一行，通常后面的错误都是它引起的。')}</p>
      </div></div>
    </div>`;

    h += `<div class="row"><button class="act primary" data-retry>再分析一次</button>
      <button class="act" data-ask>就这个问小D</button></div>`;

    body.innerHTML = h;
    return c;
  }

  function renderChat(item){
    const c = cardBase(item, 'chat', '追问', 'info');
    c.querySelector('.body').innerHTML = item.loading
      ? `<div class="loading"><span class="dots"><span></span><span></span><span></span></span><span>小D想想怎么讲…</span></div>`
      : `<p style="margin:0;white-space:pre-wrap;font-size:14.5px">${esc(item.answer||item.error||'')}</p>`;
    return c;
  }

  /* ------------------------------------------------------------------ 布局：小D指认 */
  function wireScene(node){
    const stage = node.querySelector('[data-stage]');
    if(!stage) return;
    const crash = node.querySelector('[data-crash]');
    if(crash){
      const w = crash.clientWidth || 300;
      crash.style.setProperty('--run', Math.max(30, w - 34 - 70) + 'px');
      replayCrash(crash);
    }
    const hot = stage.querySelector('.cline.hot, .cline.warnhot');
    if(!hot) { wireEmptyStage(stage); return; }

    requestAnimationFrame(()=>{
      const sr = stage.getBoundingClientRect();
      const hr = hot.getBoundingClientRect();
      const robotEl = stage.querySelector('.robotzone');
      if(!robotEl) return;
      const rr = robotEl.getBoundingClientRect();
      const svg = stage.querySelector('[data-leader]');
      if(!svg) return;

      /* 肩膀与手（按 viewBox 100x124 换算） */
      const sx = rr.left - sr.left + rr.width * 0.76;
      const sy = rr.top - sr.top + rr.height * 0.56;
      const handR = rr.width * 0.245;
      const tx = hr.left - sr.left + 22;
      const ty = hr.top - sr.top + hr.height / 2;

      const ang = Math.atan2(ty - sy, tx - sx);
      const hx = sx + Math.cos(ang) * handR * 1.35;
      const hy = sy + Math.sin(ang) * handR * 1.35;

      const arm = stage.querySelector('.robot .arm');
      if(arm){
        const base = -41.6; /* 手臂原本是向右上 41.6 度 */
        arm.style.transform = 'rotate(' + ((ang * 180 / Math.PI) - base) + 'deg)';
      }

      const midX = (hx + tx) / 2;
      const d = 'M' + hx + ',' + hy + ' C' + (midX + 18) + ',' + hy + ' ' + (midX - 18) + ',' + ty + ' ' + tx + ',' + ty;
      svg.innerHTML = `<defs><marker id="ah" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
          <path d="M0,0 L7,3.5 L0,7 z" fill="#e2643b"/></marker></defs>
        <path class="path" d="${d}"/>
        <circle class="ring" cx="${tx}" cy="${ty}" r="5"/>
        <circle class="dot" cx="${tx}" cy="${ty}" r="3.5" marker-end="url(#ah)"/>`;
      svg.setAttribute('viewBox', '0 0 ' + sr.width + ' ' + sr.height);
      svg.setAttribute('width', sr.width);
      svg.setAttribute('height', sr.height);
    });
  }

  function wireEmptyStage(stage){
    const svg = stage.querySelector('[data-leader]');
    if(svg) svg.innerHTML = '';
  }

  function replayCrash(node){
    const n = node;
    n.classList.remove('play');
    void n.offsetWidth;
    n.classList.add('play');
  }

  /* ------------------------------------------------------------------ 卡片管理 */
  const renderers = {
    analysis: renderAnalysis,
    chat: renderChat
  };

  function addCard(item){
    const fn = renderers[item.type];
    if(!fn) return null;
    const node = fn(item);
    cards.set(item.id, {item, node});
    feedEl.appendChild(node);
    wireScene(node);
    feedEl.scrollTop = feedEl.scrollHeight;
    return node;
  }

  function replaceCard(item){
    const rec = cards.get(item.id);
    if(!rec){ addCard(item); return; }
    const fn = renderers[item.type];
    if(!fn) return;
    const node = fn(item);
    rec.node.replaceWith(node);
    rec.node = node; rec.item = item;
    wireScene(node);
  }

  /* ------------------------------------------------------------------ 状态 */
  function baseName(p){ return (p||'').split(/[\\/]/).pop(); }

  function setStatus(s){
    if(!s) return;
    const now = document.getElementById('stNow');
    const last = document.getElementById('stLast');
    if(s.phase === 'compiling'){
      pill.textContent = '编译中'; pill.className='pill busy';
      barWrap.classList.add('busy');
      now.textContent = '正在编译 ' + (baseName(s.source) || '…');
    } else {
      pill.textContent = '待命'; pill.className='pill live';
      barWrap.classList.remove('busy');
      barWrap.querySelector('.bar').style.width='0%';
      if(s.lastOk === false) now.textContent = '编译失败 · ' + (s.lastErrors||0) + ' 个错误';
      else if(s.lastOk === true) now.textContent = '编译通过';
      else if(typeof s.lastExit === 'number' && s.lastExit !== 0) now.textContent = '运行崩溃 · 退出码 ' + s.lastExit;
      else now.textContent = '待命';
    }
    if(s.lastAnalysis){
      const la = s.lastAnalysis;
      last.textContent = '上次：' + (la.line ? '第'+la.line+'行 · ' : '') + (la.title||'');
    }
  }

  /* ------------------------------------------------------------------ SSE */
  function reportDpr(){
    /* 告诉后台网页的缩放比，后台据此把窗口宽度换算成 440 逻辑像素 */
    try{
      fetch('/api/panelmetrics',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({dpr: window.devicePixelRatio || 1})});
    }catch(e){}
  }
  function connect(){
    reportDpr();
    const es = new EventSource('/api/stream');
    es.onmessage = (ev)=>{
      let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
      if(m.t === 'snapshot'){
        feedEl.innerHTML=''; cards.clear();
        if(m.config) cfg = m.config;
        if(typeof m.dockMode === 'string') setDockUI(m.dockMode);
        if(m.feed && m.feed.length){ for(const it of m.feed) addCard(it); }
        else feedEl.appendChild(emptyState());
        setStatus(m.state);
        if(!cfg.apiKeySet) showNoKeyHint();
        setTimeout(rewireAll, 60);
      } else if(m.t === 'reset'){
        /* 只保留最新一条分析：清掉旧分析卡 */
        for(const [id,rec] of [...cards.entries()]){
          if(rec.item.type === 'analysis'){ rec.node.remove(); cards.delete(id); }
        }
      } else if(m.t === 'item'){
        removeEmpty(); addCard(m.item);
      } else if(m.t === 'update'){
        replaceCard(m.item);
      } else if(m.t === 'status'){ setStatus(m.state); }
      else if(m.t === 'config'){ cfg = m.config; }
    };
    es.onerror = ()=>{ pill.textContent='重连中'; pill.className='pill'; };
  }

  function rewireAll(){
    for(const [,rec] of cards) wireScene(rec.node);
  }
  window.addEventListener('resize', ()=>{ clearTimeout(window._rw); window._rw = setTimeout(rewireAll, 160); });

  function emptyState(){
    return el(`<div class="empty" id="emptystate">
      <div class="emrobot">${robotSVG('idle')}</div>
      <div class="big">小D 在等你按下编译键</div>
      在 Dev-C++ 里点 <kbd>F11</kbd>（编译运行）或 <kbd>F9</kbd>（编译）<br>
      一旦报错 / 崩溃，我会指着那一行讲给你听
    </div>`);
  }
  function removeEmpty(){ const e=document.getElementById('emptystate'); if(e) e.remove(); }

  function showNoKeyHint(){
    if(document.getElementById('nokey')) return;
    const b = el(`<div class="banner" id="nokey">
      <b>还没填 API Key</b>　填一下小D才会讲话
      <span class="spacer" style="flex:1"></span>
      <button class="act primary" data-goset>现在填写</button>
    </div>`);
    document.body.insertBefore(b, feedEl);
  }

  /* ------------------------------------------------------------------ 设置与按钮 */
  function openSettings(){
    fetch('/api/config').then(r=>r.json()).then(c=>{
      cfg = c;
      document.getElementById('cfgBase').value = c.apiBase || '';
      document.getElementById('cfgKey').value = '';
      document.getElementById('cfgKey').placeholder = c.apiKeySet ? c.apiKeyMasked + '（已保存，留空不修改）' : 'sk-...';
      document.getElementById('cfgModel').value = c.model || '';
      document.getElementById('cfgTemp').value = c.temperature;
      document.getElementById('cfgAutoOpen').checked = !!c.autoOpenPanel;
      document.getElementById('cfgWarn').checked = !!c.explainWarnings;
      document.getElementById('cfgRun').checked = !!c.explainRuntime;
      document.getElementById('settings').classList.add('show');
    });
  }
  document.getElementById('btnSet').onclick = openSettings;
  document.getElementById('btnCloseSet').onclick = ()=>document.getElementById('settings').classList.remove('show');
  document.getElementById('settings').addEventListener('click', e=>{
    if(e.target.id === 'settings') document.getElementById('settings').classList.remove('show');
  });
  document.getElementById('btnSave').onclick = async ()=>{
    const patch = {
      apiBase: document.getElementById('cfgBase').value.trim(),
      model: document.getElementById('cfgModel').value.trim() || 'deepseek-chat',
      temperature: parseFloat(document.getElementById('cfgTemp').value) || 0.2,
      autoOpenPanel: document.getElementById('cfgAutoOpen').checked,
      explainWarnings: document.getElementById('cfgWarn').checked,
      explainRuntime: document.getElementById('cfgRun').checked
    };
    const key = document.getElementById('cfgKey').value.trim();
    if(key) patch.apiKey = key;
    await fetch('/api/config', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(patch)});
    document.getElementById('testresult').innerHTML = '<span style="color:var(--ok)">已保存</span>';
    document.getElementById('nokey')?.remove();
    toast('设置已保存');
    setTimeout(()=>document.getElementById('settings').classList.remove('show'), 500);
  };
  document.getElementById('btnTest').onclick = async ()=>{
    const box = document.getElementById('testresult');
    box.innerHTML = '测试中…';
    const r = await fetch('/api/test', {method:'POST'});
    const j = await r.json();
    box.innerHTML = j.ok
      ? `<span style="color:var(--ok)">连接成功（${esc(j.model)}）</span>`
      : `<span style="color:var(--danger)">失败：${esc(j.error||'')}</span>`;
  };

  async function reanalyze(){
    const r = await fetch('/api/reanalyze', {method:'POST'});
    const j = await r.json();
    if(!j.ok) toast(j.error || '没有可分析的记录');
  }
  document.getElementById('btnReview').onclick = async ()=>{
    const r = await fetch('/api/review', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
    const j = await r.json();
    if(!j.ok) toast(j.error || '先编译一次或打开一个 C/C++ 文件');
  };

  /* 停靠 / 浮窗 */
  function setDockUI(mode){
    dockMode = mode;
    const btn = document.getElementById('btnDock');
    btn.classList.toggle('on', mode === 'dock');
    btn.innerHTML = mode === 'dock'
      ? '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16"/><path d="M14 4v16"/></svg>'
      : '<svg viewBox="0 0 24 24"><rect x="7" y="7" width="13" height="12"/><path d="M4 3h9v4"/></svg>';
    btn.title = mode === 'dock' ? '当前：嵌在 Dev-C++ 里（点一下改成独立浮窗）' : '当前：独立浮窗（点一下嵌回 Dev-C++）';
  }
  document.getElementById('btnDock').onclick = async ()=>{
    const next = dockMode === 'dock' ? 'float' : 'dock';
    await fetch('/api/dockmode', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({mode:next})});
    setDockUI(next);
    toast(next === 'dock' ? '正在嵌回 Dev-C++…' : '已切成独立浮窗');
  };
  setDockUI('dock');

  /* ------------------------------------------------------------------ 追问 */
  const q = document.getElementById('q');
  async function send(text){
    text = (text || q.value).trim();
    if(!text) return;
    q.value = '';
    const item = {id:'c'+Date.now(), type:'chat', ts:Date.now(), title:'你：'+text, loading:true};
    addCard(item);
    const r = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question:text})});
    const j = await r.json();
    item.loading = false;
    item.answer = j.ok ? j.answer : '';
    item.error = j.ok ? '' : (j.error||'出错了');
    replaceCard(item);
  }
  document.getElementById('sendbtn').onclick = ()=>send();
  q.addEventListener('keydown', e=>{
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });

  /* ------------------------------------------------------------------ 全局点击代理 */
  feedEl.addEventListener('click', (e)=>{
    const t = e.target.closest('[data-copy],[data-retry],[data-goset],[data-ask],[data-toggle-log],[data-toggle-code],[data-replay]');
    if(!t) return;

    if(t.hasAttribute('data-copy')){
      navigator.clipboard.writeText(t.getAttribute('data-copy')).then(()=>{
        const old = t.textContent; t.textContent = '已复制 ✓';
        setTimeout(()=>t.textContent = old, 1400);
      });
    }
    if(t.hasAttribute('data-retry')) reanalyze();
    if(t.hasAttribute('data-goset')) openSettings();
    if(t.hasAttribute('data-ask')){
      const rec = [...cards.values()].reverse().find(r=>r.item.type==='analysis' && r.item.status==='done');
      const d = rec && rec.item.data;
      if(d) send('再讲讲：' + (d.title||'这个错误') + ' 为什么会这样？该怎么避免？');
    }
    if(t.hasAttribute('data-toggle-log') || t.hasAttribute('data-toggle-code')){
      const pre = t.nextElementSibling;
      if(pre && pre.tagName === 'PRE'){
        const show = pre.style.display === 'none';
        pre.style.display = show ? 'block' : 'none';
        const chev = t.querySelector('.chev');
        if(chev) chev.textContent = show ? '收起 ▲' : '展开 ▼';
      }
    }
    if(t.hasAttribute('data-replay')){
      const scene = t.closest('[data-crash]');
      if(scene) replayCrash(scene);
    }
  });

  document.addEventListener('click', e=>{
    const b = e.target.closest('[data-goset]');
    if(b && document.getElementById('nokey')) openSettings();
  });

  setStatus({phase:'idle'});
  connect();
})();
</script>
</body>
</html>
