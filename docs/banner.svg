<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12161b"/>
      <stop offset="0.55" stop-color="#171b22"/>
      <stop offset="1" stop-color="#241014"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2624b" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#b01f2c" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="520" fill="url(#bg)"/>
  <circle cx="1120" cy="80" r="220" fill="#e2624b" opacity="0.10"/>
  <circle cx="120" cy="470" r="200" fill="#3a6ea5" opacity="0.10"/>

  <!-- 标题 -->
  <text x="72" y="112" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="26" fill="#8b97a6" letter-spacing="6">DEV-C++ · SMART OVERLAY</text>
  <text x="68" y="196" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="72" font-weight="700" fill="#f4f1ea">小D · DevAI</text>
  <text x="72" y="252" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="28" fill="#c9d1d9">编译一报错，小D 就在那一行划重点</text>
  <text x="72" y="292" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" fill="#7d8794">红线定位 · 三句话讲清 · 折叠讲解卡 · 零打扰</text>

  <!-- 代码窗口 -->
  <g transform="translate(64 322)">
    <rect width="760" height="176" rx="12" fill="#0d1117" stroke="#2b3340"/>
    <rect x="0" y="0" width="760" height="30" rx="12" fill="#161b22"/>
    <circle cx="20" cy="15" r="5" fill="#e2624b"/><circle cx="38" cy="15" r="5" fill="#e3b341"/><circle cx="56" cy="15" r="5" fill="#3fb950"/>
    <text x="74" y="20" font-family="Consolas, monospace" font-size="13" fill="#6e7681">_demo.cpp</text>

    <text x="18" y="66" font-family="Consolas, monospace" font-size="17" fill="#6e7681">6</text>
    <text x="52" y="66" font-family="Consolas, monospace" font-size="17" fill="#c9d1d9">    <tspan fill="#c9d1d9">int </tspan><tspan fill="#79c0ff">a</tspan> = 5;</text>

    <rect x="8" y="78" width="744" height="34" rx="6" fill="url(#hot)" opacity="0.30"/>
    <rect x="8" y="78" width="5" height="34" rx="2" fill="#e2624b"/>
    <text x="18" y="101" font-family="Consolas, monospace" font-size="17" fill="#6e7681">8</text>
    <text x="52" y="101" font-family="Consolas, monospace" font-size="17" fill="#f0b8ae">    <tspan fill="#c9d1d9">int </tspan><tspan fill="#ffa198">p</tspan> = &amp;a;</text>

    <text x="18" y="137" font-family="Consolas, monospace" font-size="17" fill="#6e7681">9</text>
    <text x="52" y="137" font-family="Consolas, monospace" font-size="17" fill="#8b949e">    cout &lt;&lt; <tspan fill="#a5d6ff">"hello"</tspan> &lt;&lt; endl;</text>

    <text x="18" y="166" font-family="Consolas, monospace" font-size="17" fill="#6e7681">10</text>
    <text x="52" y="166" font-family="Consolas, monospace" font-size="17" fill="#8b949e">    cout &lt;&lt; <tspan fill="#ffa198">p</tspan> &lt;&lt; endl;</text>
  </g>

  <!-- 小D -->
  <g transform="translate(20 350)">
    <line x1="46" y1="0" x2="46" y2="16" stroke="#e2624b" stroke-width="3"/>
    <circle cx="46" cy="-4" r="7" fill="#e2624b"/>
    <rect x="4" y="16" width="84" height="76" rx="10" fill="#fffdf5" stroke="#22272e"/>
    <rect x="20" y="40" width="13" height="13" fill="#22272e"/>
    <rect x="56" y="40" width="13" height="13" fill="#22272e"/>
    <rect x="28" y="66" width="34" height="5" rx="2" fill="#22272e"/>
    <path d="M84 54 L120 60" stroke="#e2624b" stroke-width="2" stroke-dasharray="6 5"/>
  </g>

  <!-- 三框卡片 -->
  <g transform="translate(876 322)">
    <rect width="340" height="176" rx="12" fill="#fffdf5" stroke="#22272e"/>
    <text x="18" y="34" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#22272e">小D · 第 8 行</text>
    <rect x="18" y="46" width="304" height="1" fill="#e6e0d4"/>

    <rect x="18" y="58" width="4" height="22" fill="#e2624b"/>
    <text x="30" y="75" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#e2624b">① 错误原因</text>
    <text x="30" y="96" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#3d4450">int 装不下指针地址</text>

    <rect x="18" y="108" width="4" height="22" fill="#2f9e44"/>
    <text x="30" y="125" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#2f9e44">② 改这里</text>
    <text x="30" y="146" font-family="Consolas, monospace" font-size="14" fill="#1f6f36">int *p = &amp;a;</text>

    <rect x="18" y="156" width="4" height="18" fill="#3a6ea5"/>
    <text x="30" y="170" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#3a6ea5">③ 知识点</text>
  </g>

  <text x="64" y="508" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#5d6673">Windows · Dev-C++ 6.x · Node.js · 本地运行 · API Key 只存本机</text>
</svg>
